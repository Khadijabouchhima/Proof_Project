model_version: "risk_v1_logistic_framingham"

target: "TenYearCHD"

features:
  - male
  - age
  - currentSmoker
  - cigsPerDay
  - BPMeds
  - prevalentStroke
  - prevalentHyp
  - diabetes
  - totChol
  - sysBP
  - diaBP
  - BMI
  - heartRate
  - glucose

binary_features:
  - male
  - currentSmoker
  - BPMeds
  - prevalentStroke
  - prevalentHyp
  - diabetes

continuous_features:
  - age
  - cigsPerDay
  - totChol
  - sysBP
  - diaBP
  - BMI
  - heartRate
  - glucose

logistic_regression:
  C: 1.0
  max_iter: 2000
  random_state: 42

input_completeness:
  low_threshold: 0.75