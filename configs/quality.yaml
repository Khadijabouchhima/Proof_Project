# BioVance Data Quality Engine
#
# These thresholds are engineering defaults.
# They should later be verified/calibrated using TRAIN/CALIBRATION data,
# not chosen using the final test set.

columns:
  patient_id:
    - patient_id
    - subject_id
    - participant_id
    - participant
    - id

  timestamp:
    - timestamp
    - datetime
    - date_time
    - date
    - time

  signal:
    - signal
    - signal_name

  value:
    - value
    - signal_value

  coverage:
    - coverage
    - signal_coverage

  sample_count:
    - sample_count
    - n_samples
    - n_observations

  sensor_confidence:
    - sensor_confidence
    - confidence
    - confidence_raw

  valid:
    - valid
    - validity
    - valid_day


profiles:

  pmdata:

    status_thresholds:
      good: 0.80
      fair: 0.50

    # Extremely poor coverage is a hard failure regardless
    # of the weighted quality score.
    hard_min_coverage: 0.20

    weights:
      coverage: 0.45
      samples: 0.35

      # Keep at 0 until PMData confidence semantics are
      # verified and normalized properly.
      confidence: 0.00

      validity: 0.20

    signals:

      hr:
        aliases:
          - hr
          - heart_rate

        # Starting engineering value only.
        # This must eventually be justified from PMData
        # sampling semantics or calibration experiments.
        target_samples: 100

        hard_min_samples: 3

        # Disabled until hr_conf_mean scale is verified.
        confidence_min: null
        confidence_max: null

      hrv:
        aliases:
          - hrv
          - rmssd
          - sdnn

        target_samples: 1
        hard_min_samples: 1
        confidence_min: null
        confidence_max: null

      sbp:
        aliases:
          - sbp
          - systolic
          - systolic_bp

        target_samples: 1
        hard_min_samples: 1
        confidence_min: null
        confidence_max: null

      dbp:
        aliases:
          - dbp
          - diastolic
          - diastolic_bp

        target_samples: 1
        hard_min_samples: 1
        confidence_min: null
        confidence_max: null

      spo2:
        aliases:
          - spo2

        target_samples: 10
        hard_min_samples: 1
        confidence_min: null
        confidence_max: null